overlay: 1.0.0
info:
  title: API Evangelist enhancements for Gamesight Measurement API
  version: 1.0.0
extends: openapi/gamesight-measurement-openapi.json
actions:
  - target: $.info
    update:
      x-apievangelist-enriched: '2026-07-19'
      x-apievangelist-source: https://docs.gamesight.io/reference
      x-api-type: measurement-ingest
      x-rate-limit-headers:
        - x-ratelimit-limit
        - x-ratelimit-remaining
        - x-ratelimit-reset
  - target: $.info
    update:
      x-agent-ready:
        auth: apiKey (Authorization header)
        idempotency: not-documented
        events: single (/events) and batch (/events/batch, up to 500/min)
