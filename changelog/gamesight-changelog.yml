note: >-
  Gamesight publishes a dated monthly product-updates changelog. Entries are
  product-level rollups, not API release notes: they are not labeled breaking vs
  additive and they do not carry API version numbers, so breaking-change
  classification below is left null rather than guessed. Each month's items are
  prefixed in the source with emoji severity markers — new feature, improvement,
  under-the-hood, and fix. Round 2 pulled the two most recent months in full and
  extended the index back through July 2025 from the docs llms.txt.
  Note the provider's own index lists a "December 2026" entry positioned between
  January 2026 and November 2025, which is a labeling error on their side; it is
  recorded verbatim as published rather than silently corrected.
