    title: April 2026 product updates
    url: https://docs.gamesight.io/changelog/april-2026
    breaking: null
    highlights:
      - Creator Dashboard Announcements — post announcements with optional CTA buttons to a Creator Program's public dashboard.
      - Creator Dashboard Resource Links — manage a sidebar of creator assets, ToS, brand guidelines and overlays on Creator Program sites.
      - Grand Prize Draw Quests — a quest type where each completion earns another entry in a grand prize drawing.
      - Attribution Performance — 2x+ throughput improvement via dynamic batch sizing and auto-tuning optimizations.
      - Search Synonyms — activation column searches now match synonyms ("D1" matches "Deliverable 1").
      - Postback Log Updates — improved postback logging visibility for several ad networks.
      - Daily Profile Refresh — every creator in a campaign or program refreshed at least daily across TikTok, Instagram, Twitter/X and YouTube.
  - date: '2026-03'
    title: March 2026 product updates
    url: https://docs.gamesight.io/changelog/march-2026
    breaking: null
    highlights:
      - Community Quests — collaborative quest format where a whole program contributes toward a shared goal.
      - Mass Mail Composer — drag-and-drop block editor for branded creator email with templates, variables and live preview.
      - Application Form Filters — filter the applications table by custom form field values.
      - Influencer Profile Merging — merge duplicate influencer profiles from the console with merge-direction control.
      - Content Tab Sorting & Filtering — cross-page sorting and filtering on the Content tab.
      - Collection Pipeline Reliability — resolved data-collection scheduling edge cases with automated gap monitoring.
