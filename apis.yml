aid: gamesight
name: Gamesight
description: >-
  Gamesight is a performance marketing platform for PC and console games, giving
  game publishers the data, technology, and expertise to reach players across a
  title's lifecycle. Its Marketing Measurement suite delivers attribution for PC,
  console, and web games, cost aggregation from ad networks, and incrementality
  testing, while its Creator Marketing products run influencer campaigns, creator
  programs, and creator-led playtests. Developers integrate via a REST Measurement
  (ingest) API that streams in-game events with device identifiers, a Reporting
  API that pulls marketing analytics into a data warehouse, and a web measurement
  JavaScript SDK. The platform processes over a billion gaming data points daily
  and is SOC 2, GDPR, and CCPA compliant.
