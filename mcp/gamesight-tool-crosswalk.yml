note: >-
  Gamesight has BOTH a hosted MCP server (https://console.gamesight.io/mcp,
  verified by probe) and published OpenAPI, so a crosswalk is required. But the
  MCP tool list is OAuth-gated: tools/list returns 401 invalid_token, and
  Gamesight publishes no tool list in its docs or llms.txt. There is therefore
  NO published tool inventory to bind operations to, and none is invented here.
  crosswalk[] is deliberately empty. What CAN be recorded honestly is the REST
  side of the divergence: every public OpenAPI operation, none of which is
  currently known to have a corresponding MCP tool. When an authenticated
  tools/list becomes available, bind these rows and move them out of rest_only[].
