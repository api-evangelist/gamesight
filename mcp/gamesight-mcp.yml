note: >-
  UPGRADE (2026-08-13). The 2026-07-19 pass concluded no Gamesight MCP server
  existed and wrote a derived candidate tool list with `deployment.mode: none`.
  That was wrong. Gamesight runs a real, hosted, remote MCP server at
  https://console.gamesight.io/mcp. It was found by probing the API hosts named
  in the provider's own OpenAPI servers[]: api.marketing.gamesight.io serves an
  RFC 8414 OAuth Authorization Server Metadata document whose only supported
  scope is "mcp". POSTing a JSON-RPC tools/list to https://console.gamesight.io/mcp
  returns HTTP 401 {"error":"invalid_token"} with a WWW-Authenticate header whose
  resource_metadata parameter points at
  https://console.gamesight.io/.well-known/oauth-protected-resource/mcp — an
  RFC 9728 document that names the resource "Gamesight MCP Server".
  Gamesight does not document this server anywhere in its public docs: it is
  absent from docs.gamesight.io/llms.txt, and /docs/mcp, /docs/mcp-server and
  /docs/ai-agents all 404. The endpoint is real and provider-served; the tool
  surface is OAuth-gated and therefore not enumerable anonymously.
